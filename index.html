<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kathy 的个人主页</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #243042;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 32px;
      background-color: white;
      border-radius: 16px;
    }

    h1 {
      color: #2563eb;
    }

    p {
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <main>
    <h1>你好，我是 Kathy</h1>
    <p>欢迎来到我的个人网站。</p>
    <p>我正在学习国际事务，对金融和科技投资感兴趣。</p>
    <a href="mailto:hello@example.com">联系我</a>
  </main>
</body>
</html>
